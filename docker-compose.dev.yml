services:
    app:
        build:
            context: .
            target: development
        command: pnpm dev --host 0.0.0.0
        environment:
            CI: "true"
            DATABASE_URL: postgresql://southerncross:southerncross@db:5432/southerncrossrecordbook
            BETTER_AUTH_SECRET: change-me-in-development
            PUBLIC_BETTER_AUTH_URL: http://localhost:3000
            VITE_APP_TITLE: Southern Cross Record Book
        volumes:
            - .:/app
            - app-node_modules:/app/node_modules
        depends_on:
            db:
                condition: service_healthy

volumes:
    app-node_modules:
