services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: southerncrossrecordbook
      POSTGRES_USER: southerncross
      POSTGRES_PASSWORD: southerncross
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U southerncross -d southerncrossrecordbook"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      target: production
    environment:
      DATABASE_URL: postgresql://southerncross:southerncross@db:5432/southerncrossrecordbook
      BETTER_AUTH_SECRET: change-me-in-production
      PUBLIC_BETTER_AUTH_URL: http://localhost:3000
      VITE_APP_TITLE: Southern Cross Record Book
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"

  migrate:
    build:
      context: .
      target: build
    command: pnpm db:migrate
    environment:
      DATABASE_URL: postgresql://southerncross:southerncross@db:5432/southerncrossrecordbook
      BETTER_AUTH_SECRET: change-me-in-production
      PUBLIC_BETTER_AUTH_URL: http://localhost:3000
      VITE_APP_TITLE: Southern Cross Record Book
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - tools

volumes:
  postgres-data: