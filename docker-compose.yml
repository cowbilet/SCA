services:
    db:
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: southerncrossrecordbook
            POSTGRES_USER: southerncross
            POSTGRES_PASSWORD: southerncross
        ports:
            - '5432:5432'
        volumes:
            - postgres-data:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U southerncross -d southerncrossrecordbook',
                ]
            interval: 5s
            timeout: 5s
            retries: 10

    app:
        build:
            context: .
            target: production
        environment:
            CI: 'true'
            DATABASE_URL: postgresql://southerncross:southerncross@db:5432/southerncrossrecordbook
            BETTER_AUTH_SECRET: change-me-in-production
            PUBLIC_BETTER_AUTH_URL: http://localhost:3000
            VITE_APP_TITLE: Southern Cross Record Book
        depends_on:
            db:
                condition: service_healthy
        ports:
            - '3000:3000'

    garage:
        image: dxflrs/garage:v2.3.0
        command: ['/garage', 'server', '--single-node', '--default-bucket']
        environment:
            GARAGE_CONFIG_FILE: /etc/garage.toml
            GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_DEFAULT_ACCESS_KEY:-GKchange-me}
            GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_DEFAULT_SECRET_KEY:-change-me-in-garage}
            GARAGE_DEFAULT_BUCKET: ${GARAGE_DEFAULT_BUCKET:-uploads}
        volumes:
            - ./garage.toml:/etc/garage.toml:ro
            - garage-meta:/var/lib/garage/meta
            - garage-data:/var/lib/garage/data
        ports:
            - '3900:3900'
            - '3901:3901'
            - '3902:3902'
            - '3903:3903'

    migrate:
        build:
            context: .
            target: build
        command: pnpm db:migrate
        environment:
            DATABASE_URL: postgresql://southerncross:southerncross@db:5432/southerncrossrecordbook
            BETTER_AUTH_SECRET: change-me-in-production
            PUBLIC_BETTER_AUTH_URL: http://localhost:3000
            VITE_APP_TITLE: Southern Cross Record Book
        depends_on:
            db:
                condition: service_healthy
        profiles:
            - tools

volumes:
    postgres-data:
    garage-meta:
    garage-data:
